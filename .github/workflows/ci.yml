name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-frontmatter:
    name: Lint SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate every SKILL.md
        run: |
          set -e
          FAIL=0
          for f in $(find skills -name 'SKILL.md' -o -name '*.skill.md'); do
            python3 - "$f" <<'PY'
          import sys, yaml, re, pathlib
          p = pathlib.Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          m = re.match(r'^---\n(.*?)\n---\n', text, re.DOTALL)
          if not m:
              print(f"::error file={p}::missing YAML frontmatter")
              sys.exit(1)
          try:
              fm = yaml.safe_load(m.group(1)) or {}
          except yaml.YAMLError as e:
              print(f"::error file={p}::invalid YAML — {e}")
              sys.exit(1)
          required = ['name', 'description']
          missing = [k for k in required if k not in fm or not fm[k]]
          if missing:
              print(f"::error file={p}::missing required field(s): {missing}")
              sys.exit(1)
          name = fm['name']
          if not re.match(r'^[a-z0-9][a-z0-9\-]+$', name):
              print(f"::error file={p}::name must be kebab-case alphanumeric, got {name!r}")
              sys.exit(1)
          if len(fm['description']) < 20:
              print(f"::error file={p}::description too short (<20 chars)")
              sys.exit(1)
          print(f"OK: {p}  (name={name})")
          PY
          done
          echo "All SKILL.md files passed."

  lint-examples:
    name: Each skill has at least one example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check examples exist
        run: |
          set -e
          for d in skills/*/; do
            if [ ! -d "${d}examples" ] || [ -z "$(ls -A ${d}examples 2>/dev/null)" ]; then
              echo "::error::${d} has no examples/ content"
              exit 1
            fi
          done
          echo "All skills have examples."
